home: docs
engine: none
pages:
  - path: README.md
    mode: none
    adopted: true
    documents: [README.md, docs/**]
  - path: getting-started.md
    mode: tutorial
    documents: [package.json, README.md, tsconfig.json]
  - path: how-to/use-the-extension.md
    mode: how-to
    documents: [package.json, src/extension.ts, src/ui/**]
  - path: how-to/add-language-support.md
    mode: how-to
    adopted: true
    documents: [docs/CONTRIBUTING.md, src/analyzer/universal/**, package.json]
  - path: CONTRIBUTING.md
    mode: how-to
    adopted: true
    documents: [docs/CONTRIBUTING.md, package.json, src/**, test/**]
  - path: ARCHITECTURE.md
    mode: explanation
    adopted: true
    documents: [src/**, package.json]
  - path: reference.md
    mode: reference
    documents: [package.json]
